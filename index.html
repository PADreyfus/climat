<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climat, Cause à Effet</title>
<style>
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body{ margin:0; font:14px/1.45 system-ui, sans-serif; background:#faf9f7; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sheet:rgba(255,255,255,.90); --ctl:rgba(255,255,255,.72);
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#A1A1A8;
  --hair:rgba(0,0,0,.10); --fill:rgba(120,120,128,.12);
  --accent:#0071E3; --warm:#D0402A; --cool:#0B8A78;
  --adj:#F4F8FE;
  --r:13px; --rl:20px;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --sheet:rgba(28,28,30,.88); --ctl:rgba(44,44,46,.72);
    --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#6C6C70;
    --hair:rgba(255,255,255,.14); --fill:rgba(120,120,128,.24);
    --accent:#0A84FF; --warm:#FF6A50; --cool:#2FD3B4;
    --adj:#1B2430;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --sheet:rgba(28,28,30,.88); --ctl:rgba(44,44,46,.72);
  --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#6C6C70;
  --hair:rgba(255,255,255,.14); --fill:rgba(120,120,128,.24);
  --accent:#0A84FF; --warm:#FF6A50; --cool:#2FD3B4;
  --adj:#1B2430;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.glass{background:var(--ctl);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 0 0 .5px var(--hair), 0 6px 26px -14px rgba(0,0,0,.5)}

/* ---------- plan de travail ---------- */
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:var(--bg);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg#board{-webkit-user-drag:none}
#stage.drag{cursor:grabbing}
svg#board{display:block;width:100%;height:100%}

/* ---------- chiffre principal ---------- */
#hero{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:4;
  border-radius:var(--rl);padding:13px 18px 14px;width:max-content;max-width:min(310px,calc(100vw - 32px))}
#hero .t{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1;display:block}
#hero .u{font-size:13px;color:var(--ink-2);margin-top:6px;font-weight:600}
#hero .d2{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.35}
#hero .b{font-size:13px;color:var(--ink-2);margin-top:9px;padding-top:9px;border-top:.5px solid var(--hair)}
#hero .b b{color:var(--ink);font-weight:600}
#hero > button{display:block;width:100%;text-align:left;font:inherit;color:inherit}
#h-main{cursor:pointer}
#h-main:active{transform:scale(.99)}
#h-l{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:.5px solid var(--hair);
  font-size:12.5px;color:var(--ink-3);cursor:pointer}
#h-l.on{color:var(--ink-2)} #h-l b{font-weight:650}
#h-l svg{flex:none}
#toast{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-14px);z-index:7;
  display:flex;gap:10px;align-items:flex-start;max-width:min(430px,calc(100vw - 28px));padding:12px 15px;border-radius:15px;
  background:var(--ctl);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 0 0 .5px var(--hair),0 14px 40px -18px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .42s var(--ease);color:var(--ink-2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-size:13.5px;font-weight:650;color:var(--ink)}
#toast em{display:block;font-style:normal;font-size:12.5px;line-height:1.4;color:var(--ink-2);margin-top:2px}
#toast svg{margin-top:1px;flex:none}
.card .lk{color:var(--ink-2)}
.card.locked rect.bg{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:none}
@keyframes flash{0%{opacity:1}22%{opacity:.25}46%{opacity:1}70%{opacity:.35}100%{opacity:1}}
.card.flash{animation:flash .9s ease-out}
.lockrow{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;position:relative}
.lockrow+.lockrow::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--hair);transform:scaleY(.5)}
.lockrow .s{font-size:12.5px;font-weight:650;flex:none;width:60px;white-space:nowrap;color:var(--ink-3)}
.lockrow.hot .s{color:var(--ink)}
.lockrow .t{font-size:14px;font-weight:600}
.lockrow .t em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.lockrow .st{margin-left:auto;flex:none;color:var(--ink-3)}
.lockrow.hot .st{color:var(--ink-2)}
#h-out{margin-top:11px;padding-top:10px;border-top:.5px solid var(--hair)}
#out-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);cursor:pointer;width:100%}
#out-h .chev{margin-left:auto;transition:transform .3s var(--ease);font-size:13px;line-height:1}
#hero.closed #out-h .chev{transform:rotate(180deg)}
#hero.closed #out-list{display:none}
#out-list{margin-top:7px;display:flex;flex-direction:column;gap:1px}
.orow{display:flex;gap:9px;align-items:baseline;padding:5px 6px;margin:0 -6px;border-radius:8px;
  width:calc(100% + 12px);text-align:left;cursor:pointer}
.orow:hover{background:var(--fill)}
.orow b{font-size:15px;font-weight:650;letter-spacing:-.01em;flex:none;min-width:78px;text-align:right}
.orow span{font-size:12px;color:var(--ink-2);line-height:1.3}
.orow span em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:1px}
#out-key{margin:11px 0 0;padding-top:9px;border-top:.5px solid var(--hair);font-size:11.5px;
  line-height:1.5;color:var(--ink-3)}
#out-key b{font-weight:650} #out-key b.w{color:var(--warm)} #out-key b.c{color:var(--cool)}
#out-key .lk{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2)}
#out-key svg{vertical-align:-1px}
#src-b{display:block;margin-top:6px;font-size:11.5px;font-weight:650;color:var(--accent);cursor:pointer}
.srcgrp{margin-top:16px}
.srcgrp h4{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.srcgrp ul{margin:0;padding:0;list-style:none;background:var(--card);border-radius:var(--r);overflow:hidden}
.srcgrp li{padding:10px 13px;font-size:13px;line-height:1.45;position:relative}
.srcgrp li+li::before{content:"";position:absolute;left:13px;right:0;top:0;height:1px;background:var(--hair);transform:scaleY(.5)}
.srcgrp li b{font-weight:650} .srcgrp li em{font-style:normal;color:var(--ink-3);display:block;font-size:12px;margin-top:1px}
.srcgrp li a.srcl{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--accent);
  text-decoration:none;word-break:break-all}
.srcgrp li a.srcl:hover{text-decoration:underline}
.prov{margin-top:16px;background:var(--card);border-radius:var(--r);padding:12px 13px}
.prov h4{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.prov .pk{font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.prov code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;
  background:var(--fill);border-radius:8px;padding:8px 10px;color:var(--ink);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.prov p{font-size:12px;color:var(--ink-2);margin:7px 0 0;line-height:1.45}
.prov p u{text-decoration:none;font-weight:650;color:var(--ink-2)}
.prov p.ps{color:var(--ink-3);font-size:11.5px}
.prov a{color:var(--accent);text-decoration:none;font-weight:600;word-break:break-all}
.prov a:hover{text-decoration:underline}
#hero .chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;
  background:var(--fill);margin-left:7px;vertical-align:3px}

/* ---------- scénarios ---------- */
#scen{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;transition:transform .42s var(--ease);
  border-radius:99px;padding:3px;display:flex;gap:2px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
#scen::-webkit-scrollbar{display:none}
#scen button{padding:6px 13px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2);
  transition:background .2s,color .2s}
#scen button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ---------- boutons flottants ---------- */
#tools{position:fixed;right:16px;transition:right .42s var(--ease);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:8px}
#tools button{width:42px;height:42px;border-radius:50%;font-size:17px;display:grid;place-items:center;
  transition:transform .18s var(--ease)}
#tools button:active{transform:scale(.92)}
#tools button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 0 0 .5px transparent,0 6px 20px -8px var(--accent)}
#tour{position:fixed;left:50%;transform:translate(-50%,0);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  z-index:8;width:min(470px,calc(100vw - 32px));display:flex;gap:14px;align-items:flex-start;
  pointer-events:none;
  padding:16px 18px;border-radius:18px;background:var(--ctl);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 0 0 .5px var(--hair),0 18px 50px -20px rgba(0,0,0,.5);
  animation:tin .45s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
#tour[hidden]{display:none}
#tour .t-num{font-size:12px;font-weight:650;color:var(--ink-3);flex:none;padding-top:2px;min-width:26px}
#tour .t-tot{opacity:.6}
#tour .t-body{flex:1;min-width:0}
#tour h3{font-size:15.5px;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}
#tour p{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.45}
#tour .t-act{display:flex;gap:8px;align-items:center;flex:none;align-self:flex-end}
#tour button{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--ink-2);pointer-events:auto}
#tour button.prim{background:var(--accent);color:#fff}
@media (max-width:640px){#tour{flex-wrap:wrap}#tour .t-act{width:100%;justify-content:flex-end;margin-top:4px}}
#ver{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2;
  font-size:10.5px;letter-spacing:.02em;color:var(--ink-3);opacity:.45;pointer-events:none;
  font-variant-numeric:tabular-nums;user-select:none}
@media (max-width:860px){#ver{bottom:calc(60px + env(safe-area-inset-bottom,0px));opacity:.35}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;
  font-size:12.5px;color:var(--ink-3);transition:opacity .9s;pointer-events:none;text-align:center;padding:0 16px}

/* ---------- fiche ---------- */
#sheet{position:fixed;z-index:6;border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .42s var(--ease),opacity .28s;
  background:var(--sheet);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);
  box-shadow:0 0 0 .5px var(--hair), 0 20px 60px -24px rgba(0,0,0,.45)}
@media (min-width:861px){
  #tools.shift{right:400px}
  #scen.shift{transform:translateX(calc(-50% - 192px))}
  #sheet{right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:12px;width:372px;transform:translateX(calc(100% + 20px))}
  #sheet.on{transform:none}
  #grab{display:none}
}
@media (max-width:860px){
  #scen{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:10px;right:10px;transform:none;max-width:none;justify-content:flex-start}
  #tools{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  #hint{bottom:auto;top:calc(148px + env(safe-area-inset-top,0px));font-size:12px}
  #hero{padding:11px 15px 12px}
  #sheet{left:8px;right:8px;bottom:0;max-height:76vh;border-bottom-left-radius:0;border-bottom-right-radius:0;
    transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #sheet.on{transform:none}
  #hero .t{font-size:38px}
}
#sheet:not(.on){opacity:0;pointer-events:none}
#grab{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:8px auto 0;flex:none}
.sc{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.kick{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px;font-weight:500}
.kick .ic{color:var(--ink-2);flex:none;margin-right:1px}
.kick .close{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--ink-2);
  display:grid;place-items:center;font-size:15px;line-height:1}
#sheet h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:7px 0 0;text-wrap:balance}
.val{margin-top:14px}
.val .n{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.val .c{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.desc{margin:14px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.47}
.note{margin:10px 0 0;font-size:12.5px;color:var(--ink-3)}
.grp{background:var(--card);border-radius:var(--r);margin-top:18px;overflow:hidden}
.ghdr{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 7px 4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--hair);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .rt{font-size:14px;font-weight:600;line-height:1.25;min-width:0}
.row .rt em{display:block;font-style:normal;font-size:12.5px;font-weight:400;color:var(--ink-3);margin-top:1px}
.row .rv{margin-left:auto;font-size:13px;font-weight:600;flex:none}
.row .rv i{font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3)}
.row .cv{color:var(--ink-3);font-size:16px;flex:none;margin-left:2px}
/* curseur de la fiche */
.mean{background:var(--card);border-radius:var(--r);padding:13px 15px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.mean p{margin:0} .mean p+p{margin-top:9px}
.mean .ville{margin:12px 0;padding:11px 13px;border-radius:10px;background:var(--fill);font-size:13.5px;line-height:1.55}
.mean .ville em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.4}
.mean select{font:inherit;font-weight:650;color:var(--ink);background:var(--card);border:.5px solid var(--hair);
  border-radius:7px;padding:3px 7px;margin-right:2px;cursor:pointer} .mean .dyn{color:var(--ink)} .mean b{font-weight:650}
#hero{cursor:pointer;text-align:left;font:inherit;color:inherit}
#hero:active{transform:scale(.985)}
.lev{background:var(--card);border-radius:var(--r);padding:13px 15px 8px;margin-top:18px}
.lev .lh{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:600}
.lev .lh span{margin-left:auto;font-weight:600}
.lev .ln{font-size:12px;color:var(--ink-3);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:9px 0 2px;height:28px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;
  margin-top:-11px;box-shadow:0 .5px 3px rgba(0,0,0,.3),0 4px 10px -4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 .5px 3px rgba(0,0,0,.3)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:20px}

/* ---------- cartes ---------- */
text.band{font-size:14px;font-weight:650;fill:var(--ink-3)}
line.sep{stroke:var(--hair);stroke-width:1}
.card{cursor:pointer}
.card rect.bg{fill:var(--card)}
.card.opt rect.bg{stroke:var(--hair);stroke-width:1;stroke-dasharray:4 3}
svg .ic{color:var(--ink-3)}
.card.sel .ic{color:var(--ink-2)}
.card text.t{font-size:13.5px;font-weight:600;fill:var(--ink);letter-spacing:-.006em}
.card text.v{font-size:12.5px;font-weight:600}
.card text.v tspan.qu{font-size:10px;font-weight:500;fill:var(--ink-3)}
.card.adj rect.bg{fill:var(--adj)}
.adjb{fill:var(--accent);opacity:.5}
.card.adj:hover .adjb,.card.adj:focus-visible .adjb{opacity:.9}
.card.sel rect.bg{stroke:var(--accent);stroke-width:2}
.card.dim{opacity:.26}
.far .card text{display:none}
.far text.band{font-size:26px;fill:var(--ink-2)}
.far .card .lk{display:none}
.card,.edge{transition:opacity .28s var(--ease)}
.fld rect{fill:var(--fill)}
.fld text{font-size:12.5px;font-weight:600;fill:var(--ink)}
.card.dim .fld rect{fill:none}
.stp rect{fill:var(--fill)}
.stp text{fill:var(--ink-2);font-size:14px;font-weight:600;text-anchor:middle}
.stp g{cursor:pointer}
.stp g:active rect{fill:var(--hair)}
.edge{fill:none;stroke:var(--ink-3);opacity:.34}
.edge.fb{stroke-dasharray:5 4}
.edge.hot{opacity:.95;stroke:var(--accent)}
.edge.dim{opacity:.05}
.pulse{fill:none;stroke-width:2.6;stroke-linecap:round;pointer-events:none}
.card:focus-visible rect.bg{stroke:var(--accent);stroke-width:2.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="stage">
  <svg id="board" role="img" aria-label="Les cartes du climat reliées par leurs liens de cause à effet, des activités humaines aux conflits armés."></svg>
</div>

<div id="hero" class="glass">
  <button id="h-main" title="Ce que veut dire ce chiffre">
    <span class="t" id="h-t">+2,8 °C</span>
    <div class="u" id="h-u">en 2100 · Actuel</div>
    <div class="d2" id="h-d">les politiques en place, prolongées jusqu'en 2100</div>
    <div class="b" id="h-b"></div>
  </button>
  <button id="h-l" title="Les seuils franchis"></button>
  <div id="h-out">
    <button id="out-h" aria-expanded="true">Ce que ça coûte en 2100<span class="chev">⌃</span></button>
    <div id="out-list"></div>
    <p id="out-key">Chiffres <b class="w">rouges</b> : pire que la trajectoire actuelle · <b class="c">bleus</b> : mieux.
      <span class="lk"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><use href="#ic-lock"/></svg> seuil de bascule franchi à cette température.</span>
      <button id="src-b">Sources et méthode ›</button></p>
  </div>
</div>

<div id="toast" role="status"></div>

<div id="scen" class="glass" role="group" aria-label="Scénarios"></div>

const NODES = [
{id:1,f:"act",L:0,R:3,n:"Activités humaines",m:"niveau d'activité",d:"Se nourrir, se loger, se déplacer, produire : 8 milliards d'humains, dont le niveau de vie moyen ne cesse de croître. Point de départ de tout le graphe."},
{id:2,f:"act",L:1,R:1,n:"Industrie",m:"production industrielle",d:"Acier, ciment, chimie, biens de consommation. ≈ 16 GtCO₂/an d'émissions directes et indirectes, plus les gaz fluorés du froid et de l'électronique."},
{id:3,f:"act",L:1,R:2,n:"Utilisation des bâtiments",m:"consommation des bâtiments",d:"Chauffage, eau chaude, climatisation, éclairage : ≈ 7 GtCO₂/an. La climatisation est le poste qui croît le plus vite, en boucle avec les canicules."},
{id:4,f:"act",L:1,R:3,n:"Transport",m:"trafic",d:"Route, aérien, maritime : ≈ 10 GtCO₂/an, à plus de 90 % au pétrole. Le secteur le moins décarboné à ce jour."},
{id:8,f:"act",L:1,R:5,n:"Agriculture",m:"pression agricole",d:"Nourrir 8 milliards d'humains : la moitié des terres habitables. Première cause de déforestation et premier émetteur de méthane et de protoxyde d'azote."},
{id:5,f:"ene",L:2,R:2,n:"Utilisation des énergies fossiles",m:"combustion fossile",d:"Charbon, pétrole, gaz : ≈ 80 % de l'énergie primaire mondiale. Chaque tonne de carbone brûlée finit dans l'atmosphère sous forme de CO₂."},
{id:6,f:"ene",L:2,R:5,n:"Déforestation",m:"déforestation",d:"≈ 10 Mha de forêt disparaissent chaque année. Le carbone des arbres et des sols repart dans l'air : ≈ 4,5 GtCO₂/an nettes."},
{id:10,f:"atm",L:3,R:0,n:"Émissions d'aérosols",m:"charge en aérosols",d:"Soufre et suies de la combustion. Ils réfléchissent le rayonnement solaire et masquent aujourd'hui ≈ 0,4 °C de réchauffement — un effet qui disparaît en quelques semaines si on arrête de brûler."},
{id:7,f:"ene",L:3,R:2,n:"Émissions de CO₂",m:"émissions de CO₂",d:"≈ 41,5 GtCO₂/an d'origine humaine (37 fossiles + 4,5 usage des sols). Le CO₂ est responsable des deux tiers du forçage additionnel.",anchor:"co2"},
{id:9,f:"atm",L:3,R:4,n:"Émissions d'autres GES",m:"autres gaz à effet de serre",d:"Méthane (élevage, rizières, fuites de gaz), protoxyde d'azote (engrais), gaz fluorés : ≈ 12 GtCO₂e/an. Le méthane est 80 fois plus réchauffant que le CO₂ à 20 ans.",anchor:"ghg"},
{id:12,f:"atm",L:4,R:2,n:"Puits de carbone",m:"part absorbée",d:"Océans et végétation absorbent aujourd'hui ≈ 55 % de nos émissions. Ce service gratuit s'affaiblit quand on déforeste et quand l'océan se réchauffe.",anchor:"sink"},
{id:11,f:"atm",L:5,R:2,n:"Concentration en CO₂",m:"concentration en 2100",d:"280 ppm avant l'ère industrielle, ≈ 424 ppm aujourd'hui — un niveau inédit depuis 3 millions d'années. Une partie du CO₂ émis reste dans l'air plusieurs siècles.",anchor:"ppm"},
{id:24,f:"phy",L:5,R:5,n:"Acidification de l'océan",m:"acidification",d:"Le CO₂ dissous forme de l'acide carbonique : le pH de surface est passé de 8,2 à 8,05, soit +30 % d'ions H⁺. Conséquence directe des puits de carbone océaniques.",anchor:"ph"},
{id:13,f:"atm",L:6,R:2,n:"Effet de serre additionnel",m:"effet de serre additionnel",d:"Les molécules à 3 atomes ou plus absorbent l'infrarouge que la Terre réémet. Sans effet de serre naturel : −18 °C. Ce que nous ajoutons s'empile par-dessus."},
{id:23,f:"eco",L:6,R:5,n:"Problèmes de calcification",m:"difficulté à calcifier",d:"L'acidification consomme les ions carbonate dont coquilles et squelettes calcaires sont faits. Construire sa coquille coûte de plus en plus d'énergie."},
{id:15,f:"phy",L:7,R:2,n:"Forçage radiatif",m:"forçage radiatif",d:"Le déséquilibre imposé au système climatique, en W/m². ≈ +2,7 W/m² aujourd'hui, GES moins aérosols. Étendu à la planète, cela équivaut à plusieurs bombes d'Hiroshima par seconde.",anchor:"forc"},
{id:29,f:"eco",L:7,R:5,u:"déclin",n:"Ptéropodes et coccolithophores",m:"déclin du plancton calcaire",d:"Papillons de mer et micro-algues à coque calcaire : base des réseaux trophiques marins et acteurs majeurs de la pompe biologique de carbone."},
{id:14,f:"phy",L:8,R:2,n:"Bilan énergétique",m:"énergie accumulée",d:"L'énergie piégée se répartit : 91 % dans l'océan, 5 % dans les sols, 3 % dans la fonte des glaces, 1 % dans l'atmosphère. Tout le reste du graphe découle de cette répartition.",anchor:"forc"},
{id:21,f:"phy",L:9,R:1,n:"Hausse de la température",m:"réchauffement en 2100",d:"≈ +1,3 °C au-dessus de 1850-1900 aujourd'hui. Chaque tranche de 1000 GtCO₂ émises ajoute ≈ 0,45 °C, quasi linéairement.",anchor:"dt"},
{id:17,f:"phy",L:9,R:3,n:"Hausse de la température de l'eau",m:"réchauffement de l'océan",d:"L'océan encaisse 91 % de l'excès d'énergie. Il se dilate, stratifie, perd son oxygène et alimente les cyclones.",anchor:"dtw"},
{id:18,f:"phy",L:9,R:5,n:"Fonte de la banquise",m:"perte de banquise",d:"La banquise arctique d'été a perdu ≈ 40 % de sa surface depuis 1979. Elle flotte : sa fonte n'élève pas le niveau marin, mais elle remplace un miroir blanc par un océan sombre."},
{id:16,f:"phy",L:9,R:6,n:"Fonte des glaciers",m:"perte des glaciers",d:"Les glaciers de montagne perdent ≈ 270 Gt/an. Châteaux d'eau des Andes, de l'Himalaya et des Alpes, ils régulent le débit d'été de fleuves qui alimentent des milliards de personnes."},
{id:19,f:"phy",L:9,R:7,n:"Fonte des calottes glaciaires",m:"perte des calottes",d:"Groenland : +7 m de niveau marin potentiel. Antarctique : +54 m. Elles fondent lentement mais leur engagement se joue à quelques dixièmes de degré près."},
{id:41,f:"phy",L:10,R:0,vf:s=>fr(s.p.perma*1.6)+" Gt/an",n:"Permafrost",m:"dégel du permafrost",d:"Les sols gelés du Grand Nord stockent ≈ 1500 GtC, soit le double du carbone de l'atmosphère. En dégelant, ils relâchent CO₂ et méthane : une rétroaction qui s'auto-entretient."},
{id:36,f:"phy",L:10,R:1,n:"Canicules",m:"intensité des canicules",d:"L'événement climatique le plus directement lié au réchauffement moyen : un décalage de la courbe de +1 °C multiplie par 5 à 10 la fréquence des extrêmes chauds.",g:2.2},
{id:28,f:"eco",L:10,R:2,n:"Vecteurs de maladie",m:"extension des vecteurs",d:"Moustiques (dengue, paludisme, chikungunya), tiques : la température conditionne leur aire de répartition et la vitesse de réplication des virus qu'ils portent."},
{id:20,f:"phy",L:10,R:3,n:"Perturbation du cycle de l'eau",m:"intensité du cycle de l'eau",d:"+7 % de vapeur d'eau dans l'air par degré (Clausius-Clapeyron). L'atmosphère assèche plus vite là où il ne pleut pas, et déverse plus fort là où il pleut.",g:1.2},
{id:25,f:"eco",L:10,R:4,u:"pression",n:"Biodiversité terrestre",m:"pression sur les espèces",d:"Les espèces doivent migrer de ≈ 5 km/an vers les pôles ou de 5 m/an en altitude pour rester dans leur niche climatique. Beaucoup ne le peuvent pas."},
{id:34,f:"phy",L:10,R:5,n:"Cyclones",m:"intensité des cyclones",d:"Leur nombre ne devrait pas augmenter, mais leur intensité oui : l'énergie vient de la chaleur de l'océan de surface, et les précipitations associées grimpent avec la vapeur d'eau.",g:1.4},
{id:27,f:"eco",L:10,R:6,u:"pression",n:"Biodiversité marine",m:"pression sur le vivant marin",d:"Triple peine : eau plus chaude, plus acide, moins oxygénée. Les coraux, qui abritent 25 % des espèces marines, blanchissent dès +1,5 °C.",g:1.5},
{id:22,f:"phy",L:10,R:7,n:"Montée des eaux",m:"niveau marin en 2100",d:"Deux tiers de dilatation thermique, un tiers de fonte terrestre. +20 cm depuis 1900, et un engagement de plusieurs mètres sur les siècles à venir.",anchor:"slr"},
{id:35,f:"phy",L:11,R:0,n:"Incendies",m:"risque d'incendie",d:"Chaleur, sécheresse et vent allongent la saison des feux. Les mégafeux relâchent le carbone des forêts : encore une rétroaction positive.",g:2.0},
{id:30,f:"phy",L:11,R:1,n:"Sécheresses",m:"intensité des sécheresses",d:"Moins de pluie par endroits, mais surtout plus d'évaporation partout : les sols s'assèchent même à pluviométrie constante.",g:1.7},
{id:26,f:"phy",L:11,R:2,n:"Crues",m:"intensité des crues",d:"Pluies plus intenses sur sols secs et imperméabilisés. Les épisodes cévenols ou les moussons extrêmes gagnent ≈ 7 % d'eau par degré.",g:1.5},
{id:31,f:"eco",L:11,R:3,u:"tension",n:"Ressources en eau douce",m:"tension sur l'eau douce",d:"Glaciers qui disparaissent, nappes qui ne se rechargent plus, neige qui tombe en pluie : le stock saisonnier gratuit s'évapore. 2 milliards de personnes déjà en stress hydrique."},
{id:33,f:"hum",L:11,R:7,n:"Submersions",m:"exposition à la submersion",d:"≈ 900 millions de personnes vivent à moins de 10 m au-dessus du niveau marin. Ce n'est pas la moyenne qui noie, mais la tempête posée dessus.",g:1.8},
{id:32,f:"eco",L:12,R:2,n:"Baisse des rendements agricoles",m:"perte de rendement",d:"Au-delà de +1,5 °C, les gains des hautes latitudes ne compensent plus les pertes tropicales. Blé, maïs et riz perdent ≈ 6 à 7 % de rendement par degré."},
{id:37,f:"hum",L:13,R:1,n:"Famines",m:"risque de famine",d:"La production mondiale ne manque pas encore : ce sont les chocs simultanés sur plusieurs greniers, et les prix qui s'envolent, qui affament."},
{id:38,f:"hum",L:13,R:3,u:"atteinte",n:"Santé humaine",m:"atteinte à la santé",d:"Chaleur, maladies vectorielles, malnutrition, pollution, santé mentale. L'OMS estime le climat comme la première menace sanitaire du XXIᵉ siècle."},
{id:39,f:"hum",L:13,R:5,n:"Déplacement de populations",m:"déplacements",d:"L'essentiel des mouvements est interne et régional, pas transcontinental. Ce sont les plus pauvres qui se déplacent le moins et encaissent le plus."},
{id:42,f:"hum",L:14,R:2,n:"Accroissement des inégalités",m:"creusement des inégalités",d:"Les 10 % les plus riches émettent la moitié du CO₂ ; les 50 % les plus pauvres en émettent 12 % et subissent le plus d'impacts. Le climat amplifie les écarts existants."},
{id:40,f:"hum",L:14,R:4,n:"Conflits armés",m:"risque de conflit",d:"Le climat est un multiplicateur de menace : il agit sur des tensions préexistantes (eau, terres, prix alimentaires) plutôt qu'il ne crée les conflits de toutes pièces."},

/* ---- cartes proposées, hors jeu officiel ---- */
{id:43,f:"ene",L:1,R:0,n:"Énergies bas-carbone",b:1,m:"part du bas-carbone",d:"Renouvelables et nucléaire : ≈ 18 % de l'énergie primaire. Carte manquante du jeu, qui n'aborde que les causes — elle permet de jouer la sortie des fossiles.",anchor:"lowc"},
{id:44,f:"act",L:0,R:1,n:"Sobriété et efficacité",b:1,m:"effort de sobriété",d:"Le seul levier qui agit à la source sur les quatre secteurs à la fois. Divise la demande avant même de se demander comment la produire. Dans ce simulateur, elle agit à travers les quatre curseurs de secteur."},
{id:45,f:"eco",L:3,R:6,n:"Reforestation et sols",b:1,m:"puits ajoutés",d:"Restaurer forêts, mangroves, tourbières et carbone des sols. Puissant mais lent, saturable et réversible : un complément, jamais un substitut à la baisse des émissions."},
{id:46,f:"ene",L:2,R:0,n:"Captage et stockage du CO₂",b:1,m:"CO₂ capté",d:"≈ 50 MtCO₂/an captés aujourd'hui, soit 0,1 % des émissions. Tous les scénarios 1,5 °C du GIEC en supposent des gigatonnes : un pari technologique non tenu à ce jour.",anchor:"ccs"},
{id:49,f:"hum",L:4,R:0,n:"Pollution de l'air",x:1,m:"mortalité liée à l'air",d:"Les mêmes aérosols qui refroidissent la planète tuent ≈ 4 millions de personnes par an. Le co-bénéfice santé de la sortie des fossiles est immédiat et local."},
{id:47,f:"phy",L:11,R:5,u:"faiblesse",n:"Circulation océanique (AMOC)",x:1,m:"affaiblissement de l'AMOC",d:"L'eau douce de fonte freine la plongée d'eau dense au large du Groenland. Un ralentissement marqué refroidirait l'Europe du Nord tout en déplaçant les moussons : point de bascule à basse probabilité, impact énorme.",g:1.6},
{id:48,f:"eco",L:12,R:5,n:"Dépérissement de l'Amazonie",x:1,m:"risque de bascule",d:"Entre 20 et 25 % de déforestation, la forêt ne recycle plus assez d'humidité et bascule vers la savane, relâchant des dizaines de GtC. On est à ≈ 17 %.",g:2.0},
{id:50,f:"eco",L:12,R:6,u:"perte",n:"Ressources halieutiques",x:1,m:"perte de pêche",d:"3 milliards de personnes tirent 20 % de leurs protéines animales de la mer. Les stocks migrent vers les pôles et le potentiel de capture tropical chute de 40 % à +3 °C."},
{id:52,f:"hum",L:12,R:0,n:"Stress thermique au travail",b:1,m:"heures de travail perdues",d:"Au-delà de 35 °C de température humide, le corps ne peut plus se refroidir. Des centaines de milliards d'heures de travail agricole et de BTP sont déjà perdues chaque année.",g:2.2},
{id:51,f:"hum",L:14,R:6,n:"Coût économique et assurances",x:1,m:"coût des dommages",d:"≈ 250 Md$ de dommages climatiques par an. Là où le risque devient inassurable, la valeur immobilière s'effondre avant que l'eau n'arrive."}
];

const CAL={dt:2.75,co2:41.5,ghg:12.3};

const S={}; LEVERS.forEach(l=>S[l.k]=l.def);

function physics(S,L,noFb){
  L=L||{}; const fb=noFb?0:1;
  const I=S.ind/100,B=S.bat/100,T=S.tra/100,A=S.agr/100,D=S.def/100;
  const ci=(1-S.low/100)/(1-.18);
  const fossil=Math.max(0,(16*I+7*B+10*T+4*A)*ci);
  const luc=4.5*D;
  let dT=CAL.dt,co2=CAL.co2,other=CAL.ghg,aer=1,perma=.5;
  let ppm,af,forc;                 /* réassignés à chaque tour de boucle avant d'être lus */
  for(let i=0;i<80;i++){
    const r=Math.max(0,dT/CAL.dt), r2=r*r;
    perma=Math.max(.5*r2*fb,(L.perma||0)*fb);        /* une fois le verrou fermé, le plancher reste */
    const fire=.3*r2*fb, amaz=Math.max(.25*r2*D,(L.amaz||0))*fb;
    co2=Math.max(0,fossil+luc+perma+fire+amaz-S.ccs);
    aer=fossil/37;
    other=8*A+2.5*aer+1.5*I+.3*r2;
    af=Math.min(.85,Math.max(.18,(.45/(S.sink/100))*(1+.12*(co2/CAL.co2-1))));
    const cumul=co2*75;
    ppm=420+af*cumul/7.8;
    const albedo=Math.pow(r,1.2)*fb;
    forc=5.35*Math.log(ppm/278)+.9*(other/CAL.ghg)-1*aer+.2*albedo;
    const target=1.4+.45*cumul/1000+.35*(other/CAL.ghg)-.4*aer;
    dT+=.4*(target-dT);
  }
  const slr=.21+.133*dT+(L.slr||0), ph=8.05-.000462*(ppm-420);
  const sinkflux=(1-af)*co2, budget=co2>.2?275/co2:999;
  return {fossil,luc,co2,other,aer,af,ppm,forc,dT,slr,ph,sinkflux,budget,perma,
          imbalance:.25*forc};
}
/* référence = état des curseurs « trajectoire actuelle » : tous les % du graphe s'y comparent */
const REF=(function(){const d={};LEVERS.forEach(l=>d[l.k]=l.def);const p=physics(d);
  return {co2:p.co2,ghg:p.other,ppm:p.ppm,dt:p.dT,forc:p.forc,slr:p.slr,ph:p.ph,sinkflux:p.sinkflux,af:p.af};})();
const fr=(v,d=1)=>v.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const ANCHOR={

 sink:p=>({i:p.sinkflux/REF.sinkflux, v:Math.round((1-p.af)*100)+" % absorbés"}),

/* Les seuils décrivent l'état courant, pas l'histoire de la session : ils se ferment
   en montant et se rouvrent en redescendant. Chaque réglage rejoue donc une simulation
   neuve.
   Franchir un seuil impose des planchers (permafrost, Amazonie) qui réchauffent un peu
   plus, ce qui peut en franchir d'autres : on itère jusqu'au point fixe. La suite est
   monotone — on part sans plancher, donc au ΔT le plus bas, et un plancher ne peut
   qu'ajouter des seuils — elle converge en au plus LOCKS.length passes. */
const floorsOf=set=>{
  const L={}; for(const l of set){
    if(l.perma)L.perma=Math.max(L.perma||0,l.perma);
    if(l.amaz) L.amaz =Math.max(L.amaz||0,l.amaz);
    if(l.slr)  L.slr  =(L.slr||0)+l.slr;
  } return L;
};
function settle(){
  let set=[],L={};
  for(let i=0;i<=LOCKS.length;i++){
    const next=LOCKS.filter(l=>physics(S,L).dT>=l.t);
    if(next.length===set.length) break;
    set=next; L=floorsOf(set);
  }
  return {set,L};
}
function compute(){
  const {set:LOCKSET,L}=settle();
  const p=physics(S,L), idx={};
  p.fbWarm=Math.max(0,p.dT-physics(S,L,true).dT);   /* ce que les boucles ajoutent toutes seules */
  p.locked=LOCKSET;
  const mult={}; for(const l of p.locked) if(l.idx) mult[l.id]=l.idx;
  NODES.forEach(n=>idx[n.id]=1);
  const fixed={};
  for(const id in LEVERNODE) fixed[id]=S[LEVERNODE[id]]/100;
  fixed[1]=(S.ind+S.bat+S.tra+S.agr)/400;
  fixed[5]=p.fossil/37; fixed[44]=1; fixed[43]=S.low/18; fixed[45]=S.sink/100; fixed[46]=1+S.ccs*2;
  NODES.forEach(n=>{ if(n.anchor) idx[n.id]=Math.max(0,ANCHOR[n.anchor](p,S).i); });
  Object.keys(fixed).forEach(k=>idx[k]=Math.max(0,fixed[k]));
  const anchored=new Set(NODES.filter(n=>n.anchor).map(n=>n.id).concat(Object.keys(fixed).map(Number)));
  for(let it=0;it<60;it++){
    for(const n of NODES){
      if(anchored.has(n.id)||(!showOpt&&n.b)) continue;
      let s=0,w=0;
      for(const e of IN[n.id]){
        if(e.fb) continue;                       /* les boucles sont gérées côté physique */
        if(!showOpt&&(e.B||byId[e.a].b)) continue;
        let v=idx[e.a]; if(e.neg) v=2-v;
        s+=(e.w||1)*Math.max(0,v); w+=(e.w||1);
      }
      if(w) idx[n.id]=Math.min(9,Math.pow(Math.max(0,s/w),n.g||1));
      if(mult[n.id]) idx[n.id]=Math.min(9,idx[n.id]*mult[n.id]);
    }
  }
  return {p,idx};
}
const liveEdge=e=>!(!showOpt&&(e.B||byId[e.a].b||byId[e.b].b));

    return `M${sx},${sy} C${sx+d},${sy} ${tx-d},${ty} ${tx},${ty}`;}
  if(Math.abs(X(s)-X(t))<300){const d=90+.12*Math.abs(Y(s)-Y(t));
    return `M${X(s)},${sy} C${X(s)-d},${sy} ${X(t)-d},${ty} ${X(t)},${ty}`;}
  const scx=X(s)+CW/2,tcx=X(t)+CW/2;
  if(s.R<=3) return `M${scx},${Y(s)} C${scx},60 ${tcx},60 ${tcx},${Y(t)}`;

}

/* ============================================================
   ÉTAT AFFICHÉ (interpolé pour que les nombres défilent)
   ============================================================ */
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const $=id=>document.getElementById(id);
let cur=null,last=null,anim=0,chain=null,pulseTok=0;
/* Référence des indices — le MÊME pipeline, curseurs au repos.
   Sans elle, les multiplicateurs des seuils déjà franchis sur la trajectoire actuelle
   (récifs ×1,5, calottes ×1,25, glaciers ×1,3) étaient comptés dans l'état affiché mais
   absents de la référence : au repos, sans avoir rien touché, les cartes annonçaient
   « +50 % biodiversité marine », « +24 % famines », « +12 % conflits ». Des artefacts
   de normalisation, pas des prévisions.
   Le cache dépend de showOpt, parce que compute() ignore les cartes optionnelles. */
const REFIDX={};
function refIdx(){
  const k=showOpt?"opt":"base";
  if(!REFIDX[k]){
    const save={...S};
    LEVERS.forEach(l=>S[l.k]=l.def);
    REFIDX[k]=compute().idx;
    Object.assign(S,save);
  }
  return REFIDX[k];
}
/* Seconde référence : une trajectoire qui tient ~1,5 °C (le préréglage « Neutralité »).
   Famine et conflit armé sont des indices ordinaux : rapportés à la trajectoire actuelle
   ils valent 0 % au repos, ce qui laisse croire que ne rien faire ne coûte rien. Rapportés
   à un monde à 1,5 °C, ils disent ce que la trajectoire actuelle coûte déjà. */
const REF15={};
function ref15(){
  const k=showOpt?"opt":"base";
  if(!REF15[k]){
    const save={...S};
    Object.assign(S,{ind:40,bat:30,tra:30,agr:65,def:10,low:85,sink:130,ccs:5});
    const raw=compute().idx, base=refIdx();
    REF15[k]={}; for(const j in raw) REF15[k][j]=raw[j]/(base[j]||1);
    Object.assign(S,save);
  }
  return REF15[k];
}
function snap(){
  const r=compute(), ref=refIdx(), idx={};
  for(const k in r.idx) idx[k]=r.idx[k]/(ref[k]||1);
  return {p:{...r.p,locked:r.p.locked},idx};
}
function lerp(a,b,t){const o={p:{},idx:{}};
  for(const k in b.p){const av=a.p[k],bv=b.p[k];
    o.p[k]=(typeof bv==="number"&&typeof av==="number")?av+(bv-av)*t:bv;}
  for(const k in b.idx){const v=a.idx[k]===undefined?1:a.idx[k];o.idx[k]=v+(b.idx[k]-v)*t;}
  return o;}
let hover=null;
const focusId=()=>hover!=null?hover:sel;
function chainFor(id){
  if(id==null)return null;
  const walk=dir=>{const seen=new Set(),q=[id];
    while(q.length){const cur=q.pop();
      for(const e of (dir==="up"?IN[cur]:OUT[cur])){
        if(!liveEdge(e)||e.fb)continue;
        const nx=dir==="up"?e.a:e.b;
        if(nx!==id&&!seen.has(nx)){seen.add(nx);q.push(nx);} } }
    return seen;};
  const up=walk("up"),down=walk("down");
  return {nodes:new Set([id,...up,...down]),
    edge:e=>((up.has(e.a)||e.a===id)&&(up.has(e.b)||e.b===id))||
            ((down.has(e.a)||e.a===id)&&(down.has(e.b)||e.b===id))};
}
function refreshChain(){ chain=chainFor(focusId()); }
function applyDim(){
  refreshChain();
  const f=focusId();
  NODES.forEach(n=>C[n.id].g.classList.toggle("dim",!!chain&&!chain.nodes.has(n.id)));
  edgeEls.forEach(({e,p})=>{
    const hot=f!=null&&(e.a===f||e.b===f);
    p.classList.toggle("hot",hot);
    p.setAttribute("marker-end",hot?"url(#arh)":"url(#ar)");
    p.classList.toggle("dim",!!chain&&!hot&&!chain.edge(e));
  });
}
let LOCKED=new Set();     /* seuils franchis ICI — se vide quand on redescend */
let boot=true;
function announce(l){
  const t=$("toast");
  t.innerHTML=`<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><use href="#ic-lock"/></svg>`+
    `<span><b>Seuil franchi — ${l.n}</b><em>${l.q}</em></span>`;
  t.classList.add("on"); clearTimeout(announce.tm);
  announce.tm=setTimeout(()=>t.classList.remove("on"),9000);
  const c=C[l.id]; if(c&&!RM){c.g.classList.remove("flash");void c.g.offsetWidth;c.g.classList.add("flash");}
}
function apply(fromId,keepSheet){
  const to=snap(), dir=cur?Math.sign(to.p.dT-cur.p.dT):0;
  last=to;
  let fresh=null;
  for(const l of to.p.locked) if(!LOCKED.has(l.id)) fresh=l;   /* franchi à l'instant */
  LOCKED=new Set(to.p.locked.map(l=>l.id));
  if(fresh&&!boot) announce(fresh);
  boot=false;
  if(!cur||RM){cur=to;draw(cur);}
  else{
    const from=cur,t0=performance.now(),D=420;
    cancelAnimationFrame(anim);
    (function step(){
      const t=Math.min(1,(performance.now()-t0)/D), e=1-Math.pow(1-t,3);
      cur=lerp(from,to,e); draw(cur);
      if(t<1)anim=requestAnimationFrame(step); else cur=to;
    })();
  }
  if(fromId!=null&&!RM)pulse(fromId,dir);
  if(mode==="sources"){}
  else if(mode==="locks") buildLockSheet();
  else if(sel!=null){ keepSheet?refreshSheet():buildSheet(); }
}
function pulse(from,dir){
  const depth={},q=[from]; depth[from]=0;
  while(q.length){const id=q.shift();
    for(const e of OUT[id]){ if(!liveEdge(e)||e.fb)continue;
      if(depth[e.b]===undefined&&depth[id]<9){depth[e.b]=depth[id]+1;q.push(e.b);} } }
  const tok=++pulseTok; gP.textContent="";
  const col=dir>0?"var(--warm)":dir<0?"var(--cool)":"var(--accent)";
  edgeEls.forEach(({e,p})=>{
    const d=depth[e.a]; if(d===undefined||!liveEdge(e)||e.fb)return;
    const L=p.getTotalLength(), c=p.cloneNode(false);
    c.setAttribute("class","pulse"); c.removeAttribute("marker-end");
    c.style.stroke=col; c.style.opacity=1;
    c.style.strokeDasharray=`22 ${L+2}`; c.style.strokeDashoffset=0;
    c.style.transition=`stroke-dashoffset .55s cubic-bezier(.35,0,.25,1) ${d*55}ms, opacity .3s ${d*55+400}ms`;
    gP.appendChild(c);
    requestAnimationFrame(()=>{c.style.strokeDashoffset=-L;c.style.opacity=0;});
  });
  setTimeout(()=>{if(tok===pulseTok)gP.textContent="";},1600);
}
const sgn=v=>(v>0?"+":v<0?"−":"")+Math.abs(v);
function cardTxt(n,s){
  const d=s.idx[n.id]-1;
  if(n.vf) return {txt:n.vf(s),d};
  if(ADJ[n.id]){                       /* la carte affiche son réglage : la teinte suit le réglage */

const erf=x=>{const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);
  return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x));};
const cdf=z=>.5*(1+erf(z/Math.SQRT2));
const pct0=d=>(d>0?"+":"−")+Math.round(Math.abs(d)*100)+" %";
function retour(dT){                    /* fréquence d'un été extrême du climat préindustriel */
  const loc=dT*1.4, sg=1.2*1.07, P=1-cdf((2.4-loc)/sg);
  return P<=0?999:1/P;
}
function courbe(dT){
  const W=286,H=92,x0=-3,x1=9,sc=x=>(x-x0)/(x1-x0)*W;
  const g=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/s;
  const loc=dT*1.4, s2=1.2*1.07, top=g(0,0,1.2);
  const pts=(m,s)=>{let d="";for(let i=0;i<=72;i++){const x=x0+(x1-x0)*i/72;
    d+=(i?"L":"M")+sc(x).toFixed(1)+","+(H-4-g(x,m,s)/top*(H-22)).toFixed(1);}return d;};
  let fill="M"+sc(2.4).toFixed(1)+","+(H-4);
  for(let i=0;i<=40;i++){const x=2.4+(x1-2.4)*i/40;
    fill+="L"+sc(x).toFixed(1)+","+(H-4-g(x,loc,s2)/top*(H-22)).toFixed(1);}
  fill+="L"+W+","+(H-4)+"Z";
  return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="display:block;margin:10px 0 2px" role="img"
    aria-label="La courbe des étés se décale vers la droite : ce qui était extrême devient banal.">
    <path d="${fill}" fill="${COL.warm}" opacity=".16"/>
    <path d="${pts(0,1.2)}" fill="none" stroke="${COL.ink3}" stroke-width="1.5"/>
    <path d="${pts(loc,s2)}" fill="none" stroke="${COL.warm}" stroke-width="2"/>
    <line x1="${sc(2.4)}" y1="6" x2="${sc(2.4)}" y2="${H-4}" stroke="${COL.ink3}" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${sc(0)}" y="${H+12}" font-size="10" fill="${COL.ink3}" text-anchor="middle">1900</text>
    <text x="${sc(2.4)+4}" y="13" font-size="10" fill="${COL.ink3}">extrême de 1900</text>
    <text x="${Math.min(W-2,sc(loc))}" y="${H+12}" font-size="10" fill="${COL.warm}" text-anchor="middle">ce scénario</text>
  </svg>`;
}

 39:s=>`La Banque mondiale attend ≈ 216 millions de déplacés <em>internes</em> d'ici 2050 sur la trajectoire actuelle. On part à 50 km, pas à 5 000 — et les plus pauvres sont ceux qui bougent le moins.`,
 41:s=>`≈ ${fr(s.p.perma*1.6)} Gt de CO₂e s'échappent chaque année des sols dégelés : l'équivalent de ${Math.round(s.p.perma*1.6/.4)} fois les émissions annuelles de la France, sans qu'aucun humain n'y soit pour quelque chose.`

function qualif(d){const a=Math.abs(d);
  return a<.005?"identique à la trajectoire actuelle":a<.08?"écart léger":a<.25?"écart net":a<.6?"écart majeur":"changement de régime";}
function meaning(id,s){
  const n=byId[id], d=s.idx[id]-1;
  const dyn=DYN[id]?DYN[id](s):
    `${n.m.charAt(0).toUpperCase()+n.m.slice(1)} : ${Math.abs(d)<.005?"comme sur la trajectoire actuelle":pct0(d)+" — "+qualif(d)}.`;
  return (REPERE[id]?`<p>${REPERE[id]}</p>`:"")+`<p class="dyn">${dyn}</p>`;
}

const sheetEl=$("sheet"), body=$("sheet-body");
let SR={rows:[]};
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function rowHTML(o,e,dir){
  return `<button class="row" data-go="${o.id}" data-dir="${dir}">
    <span class="rt">${esc(o.n)}<em>${esc(e.why||"")}${e.fb?" · rétroaction":""}</em></span>

}
function buildSheet(){
  const n=byId[sel], A=ADJ[n.id];
  const ins=IN[sel].filter(e=>liveEdge(e)).map(e=>rowHTML(byId[e.a],e,"in")).join("");
  const outs=OUT[sel].filter(e=>liveEdge(e)).map(e=>rowHTML(byId[e.b],e,"out")).join("");
  let lev="";
  if(A){const l=LEV[A.k], mn=A.inv?100-l.max:l.min, mx=A.inv?100-l.min:l.max;
    lev=`<div class="lev"><div class="lh">${A.lbl||n.n}<span id="sl-v"></span></div>
      <input type="range" id="sl" min="${mn}" max="${mx}" step="${A.k==="ccs"?.5:l.step}" value="${levVal(n.id)}" aria-label="${A.lbl||n.n}">
      <div class="ln">${esc(l.note)}</div></div>`;}
  body.innerHTML=`
    <div class="kick"><svg class="ic" viewBox="0 0 24 24" width="25" height="25" aria-hidden="true"><use href="#ic-${n.id}"/></svg>${FAM[n.f].n}
      <button class="close" id="sh-x" aria-label="Fermer">✕</button></div>
    <h2>${esc(n.n)}</h2>
    <div class="val"><div class="n" id="sh-n"></div><div class="c" id="sh-c"></div></div>
    ${lev}
    <p class="desc">${esc(n.d)}</p>
    ${ins?`<div class="ghdr">Ce qui la provoque</div><div class="grp">${ins}</div>`:""}
    ${outs?`<div class="ghdr">Ce qu'elle provoque</div><div class="grp">${outs}</div>`:""}
    <div class="ghdr">Ce que ça veut dire</div><div class="mean" id="sh-mean"></div>
    ${provHTML(n)}
    ${(n.b||n.x)?'<p class="note">Carte ajoutée en complément des 42 cartes officielles.</p>':""}`;
  SR={n:$("sh-n"),c:$("sh-c"),sl:$("sl"),slv:$("sl-v"),mean:$("sh-mean"),
      rows:[...body.querySelectorAll("[data-v]")].map(el=>({el,id:+el.dataset.v}))};
  $("sh-x").onclick=close;
  body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(+b.dataset.go));
  if(SR.sl){
    SR.sl.addEventListener("input",()=>{levSet(sel,+SR.sl.value);apply(null,true);});
    SR.sl.addEventListener("change",()=>{markScen();apply(sel,true);});
  }
  refreshSheet();
}
function refreshSheet(){
  if(mode==="sources") return;
  if(mode==="locks"){ if(last) buildLockSheet(); return; }
  if(sel==null||!last)return;
  const n=byId[sel], s=last, d=s.idx[sel]-1, A=ADJ[sel];
  const a=n.anchor?ANCHOR[n.anchor](s.p,S):null;
  const col=tone(sel,A?cardTxt(n,s).d:d)||"var(--ink)";
  SR.n.textContent=a?a.v:(A?levTxt(sel):sgn(Math.round(d*100))+" %");
  SR.n.style.color=a||!A?col:"var(--ink)";
  SR.c.textContent=n.m+" · "+(Math.abs(d)<.005?"au niveau de la trajectoire actuelle":sgn(Math.round(d*100))+" % vs trajectoire actuelle");
  if(SR.sl){SR.sl.value=levVal(sel);SR.slv.textContent=levTxt(sel);}
  if(SR.mean){SR.mean.innerHTML=meaning(sel,s);
    const v=SR.mean.querySelector("#ville");
    if(v) v.onchange=e=>{MAVILLE=e.target.value; refreshSheet();};}
  SR.rows.forEach(r=>{const dv=s.idx[r.id]-1, u=byId[r.id].u;
    const txt=Math.abs(dv)<.005?"":sgn(Math.round(dv*100))+" %";
    r.el.innerHTML=(u&&txt?`<i>${u}</i> `:"")+txt;
    r.el.style.color=tone(r.id,dv)||"var(--ink-3)";});
}

    return `<div class="lockrow${on?" hot":""}"><span class="s">+${fr(l.t,1)} °C</span>
      <span class="t">${l.n}<em>${l.q}</em></span>

  }).join("");
  body.innerHTML=`
    <div class="kick"><svg class="ic" viewBox="0 0 24 24" width="25" height="25" aria-hidden="true"><use href="#ic-lock"/></svg>Seuils
      <button class="close" id="sh-x" aria-label="Fermer">✕</button></div>
    <h2>Les seuils de bascule</h2>
    <div class="val"><div class="n">${p.locked.length}</div>
      <div class="c">seuils franchis à +${fr(p.dT)} °C, le réglage actuel</div></div>
    <p class="desc">${p.fbWarm>.015?`Les boucles qui se sont enclenchées ajoutent à elles seules <b>+${fr(p.fbWarm,2)} °C</b> que plus personne ne pilote.<br><br>`:""}Au-delà d'un seuil de bascule, une boucle s'entretient seule : le dégel libère du carbone, qui réchauffe, qui dégèle davantage. Le cadenas marque les seuils que franchit le réglage affiché, et rien d'autre.</p>
    <p class="note" style="margin:10px 0 0">Redescendez, et les cadenas se rouvrent : chaque réglage rejoue une simulation neuve, sans mémoire de ce qui a été essayé avant. Le climat réel, lui, ne se rejoue pas — une calotte engagée ou un permafrost en dégel ne se referment pas. C'est la limite de l'exercice, et la raison d'être de ces cadenas.</p>
    <div class="grp" style="padding:2px 0">${rows}</div>
    <p class="note">Seuils : valeur centrale de l'évaluation d'Armstrong McKay <em>et al.</em> (Science, 2022). Les fourchettes sont larges — de 0,8 à 3 °C pour le Groenland, de 1,4 à 8 °C pour l'AMOC. On sait que ces portes existent, pas exactement où sont les poignées.</p>`;
  $("sh-x").onclick=close;
}

/* ============================================================
   PROVENANCE — d'où sort le chiffre de CETTE carte.
   Dérivée du modèle lui-même (équation d'ancrage, ou parents/poids/γ réels),
   pour qu'elle ne puisse pas se désynchroniser du calcul.
   ============================================================ */
const U_AR6="https://www.ipcc.ch/report/ar6/wg1/",
      U_GCB="https://globalcarbonbudget.org/",
      U_MYH="https://doi.org/10.1029/98GL01908",
      U_AMK="https://doi.org/10.1126/science.abn7950";
const ANCHOR_SRC={
 co2 :["CO₂ = fossile + usage des sols + rétroactions − captage","Global Carbon Budget",U_GCB],
 ghg :["autres GES = 8·A + 2,5·aérosols + 1,5·I + 0,3·r²","GIEC AR6",U_AR6],
 sink:["AF = 0,45 / puits × (1 + 0,12·(CO₂/41,5 − 1))","Global Carbon Budget",U_GCB],
 ppm :["ppm = 420 + AF · cumul / 7,8   —   7,8 GtCO₂ par ppm","GIEC AR6",U_AR6],
 ph  :["pH = 8,05 − 0,000462·(ppm − 420)","interpolé entre SSP1-2.6 et SSP5-8.5 · GIEC AR6",U_AR6],
 forc:["F = 5,35·ln(ppm/278) + 0,9·autres − aérosols + 0,2·albédo","Myhre et al., 1998",U_MYH],
 ener:["déséquilibre énergétique = 0,25 · F","GIEC AR6",U_AR6],
 dt  :["ΔT = 1,4 + 0,45·cumul/1000 + 0,35·autres − 0,4·aérosols","TCRE 0,45 °C/1000 GtCO₂ · GIEC AR6",U_AR6],
 dtw :["ΔT sur les terres ≈ 0,8 · ΔT global","GIEC AR6",U_AR6],
 slr :["mer = 0,21 + 0,133 · ΔT","interpolé entre SSP1-1.9 et SSP5-8.5 · GIEC AR6",U_AR6]
};
const FIXEDN={1:"somme des quatre secteurs d'activité",5:"fossile / 37 GtCO₂",
  43:"part du bas-carbone / 18 %",44:"référence",45:"capacité des puits",46:"captage et stockage"};
function provHTML(n){
  const A=ANCHOR_SRC[n.anchor];
  let kind,eq,src=null,url=null,extra="";
  if(A){ kind="Grandeur physique, calculée"; eq=A[0]; src=A[1]; url=A[2]; }
  else if(ADJ[n.id]){ kind="Réglage"; eq="valeur lue directement sur le curseur de cette carte";
    src="inventaires · Global Carbon Budget"; url=U_GCB; }
  else if(FIXEDN[n.id]||LEVERNODE[n.id]){ kind="Dérivée des réglages";
    eq=FIXEDN[n.id]||("réglage « "+LEV[LEVERNODE[n.id]].n+" »"); }
  else {
    const ps=IN[n.id].filter(e=>!e.fb&&byId[e.a]&&(showOpt||!(e.B||byId[e.a].b)));
    kind="Indice relatif, propagé";
    eq="indice = ( Σ poids × amont ⁄ Σ poids )"+(n.g&&n.g!==1?" ^ "+fr(n.g,1):"");
    extra=ps.length?"<u>Amont pris en compte</u> "+ps.map(e=>esc(byId[e.a].n)+" ×"+fr(e.w||1,1)).join(" · ")
                   :"<u>Aucune carte en amont.</u>";
    if(n.g&&n.g!==1) extra+="<br><u>Exposant γ = "+fr(n.g,1)+"</u> : les extrêmes réagissent plus que la moyenne. Choix d'auteur, pas une mesure.";
    extra+="<br><u>Pas de source externe</u> : ce chiffre est <b>ordinal</b>. Il classe correctement cette carte par rapport aux autres ; il ne se lit pas comme une mesure. Les poids sont des jugements d'auteur.";
  }
  const lk=LOCKS.find(l=>l.id===n.id);
  if(lk) extra+=(extra?"<br>":"")+"<u>Seuil de bascule à +"+fr(lk.t,1)+" °C</u> — Armstrong McKay et al., Science 2022. "+
    (lk.idx?"Au-delà, l'indice est multiplié par "+fr(lk.idx,2)+".":"Au-delà, un plancher s'applique dans le noyau physique.");
  return `<div class="prov"><h4>D'où vient ce chiffre</h4>
    <div class="pk">${kind}</div>
    <code>${esc(eq)}</code>
    ${extra?`<p>${extra}</p>`:""}
    ${src?`<p class="ps">${esc(src)}${url?` · <a href="${url}" target="_blank" rel="noopener noreferrer">${srcHost(url)} ↗</a>`:""}</p>`:""}
    ${lk?`<p class="ps"><a href="${U_AMK}" target="_blank" rel="noopener noreferrer">${srcHost(U_AMK)} ↗</a></p>`:""}</div>`;
}

$("t-fit").onclick=()=>{const on=$("t-fit").getAttribute("aria-pressed")==="true";
  $("t-fit").setAttribute("aria-pressed",on?"false":"true"); on?home():fit();};

/* ============================================================
   NAVIGATION
   ============================================================ */
let k=1,tx=0,ty=0;
let far=false;
function setFar(){
  board.classList.toggle("far",far);
  NODES.forEach(n=>{const c=C[n.id],u=c.g.querySelector("use.ic");
    if(c.adjb){const b=far?[10,8,44,7]:[13,8,18,3.5];
      c.adjb.setAttribute("x",b[0]);c.adjb.setAttribute("y",b[1]);
      c.adjb.setAttribute("width",b[2]);c.adjb.setAttribute("height",b[3]);
      c.adjb.setAttribute("rx",b[3]/2);}
    if(!u)return;
    const v=far?[55,23,46]:[12,60,23];
    u.setAttribute("x",v[0]);u.setAttribute("y",v[1]);u.setAttribute("width",v[2]);u.setAttribute("height",v[2]);});
  if(cur)draw(cur);
}
const T=()=>{gW.setAttribute("transform",`translate(${tx},${ty}) scale(${k})`);
  const nf=k<.55; if(nf!==far){far=nf;setFar();}};
const box=()=>{const r=stage.getBoundingClientRect();
  board.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);return r;};
function home(){const r=box();k=clamp((r.height-24)/980,.55,1.05);
  const hero=$("hero").getBoundingClientRect();
  tx=r.width>860?hero.width+26:-20*k;      /* le plateau démarre à droite du bandeau */
  ty=-14*k;T(); if(sel!=null)ensureVisible(sel);}
function fit(){const r=box();k=Math.min(r.width/VW,r.height/VH)*.95;
  tx=(r.width-VW*k)/2;ty=(r.height-VH*k)/2;T();}
function ensureVisible(id){
  const n=byId[id],r=stage.getBoundingClientRect(),m=40;
  const right=r.width-(innerWidth>860&&sheetEl.classList.contains("on")?400:m);
  const x0=X(n)*k+tx,y0=Y(n)*k+ty,x1=x0+CW*k,y1=y0+CH*k;
  if(x0<m)tx+=m-x0; else if(x1>right)tx-=x1-right;
  if(y0<m)ty+=m-y0; else if(y1>r.height-m)ty-=y1-(r.height-m);
  T();
}
function zoom(f,cx,cy){const r=stage.getBoundingClientRect();
  cx=cx??r.width/2;cy=cy??r.height/2;
  const nk=clamp(k*f,.14,2.6);tx=cx-(cx-tx)*nk/k;ty=cy-(cy-ty)*nk/k;k=nk;T();}
const pts=new Map(); let g0=null,moved=0,dragging=false,downT=null;
function onDown(e){
  if(e.button>0) return;                       /* bouton gauche ou tactile seulement */
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; downT=e.target;
  if(pts.size===2){const[a,b]=[...pts.values()]; g0={d:Math.hypot(a.x-b.x,a.y-b.y),k};}
}
function onMove(e){
  const p=pts.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(pts.size===2&&g0){                        /* deux doigts : pincement */
    const[a,b]=[...pts.values()]; p.x=e.clientX; p.y=e.clientY;
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d>10){const r=stage.getBoundingClientRect();
      zoom((d/g0.d)*(g0.k/k),(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); g0.d=d; g0.k=k;}
    return;
  }
  moved+=Math.abs(dx)+Math.abs(dy);
  if(moved<4) return;                          /* sous ce seuil, c'est un clic */
  if(!dragging){dragging=true; stage.classList.add("drag");
    getSelection&&getSelection().removeAllRanges&&getSelection().removeAllRanges();}
  tx+=dx; ty+=dy; p.x=e.clientX; p.y=e.clientY; T();
}
function onUp(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); if(pts.size<2) g0=null;
  if(pts.size) return;
  stage.classList.remove("drag");
  const t=downT; downT=null;
  if(!dragging && (t===stage||t===board||t&&t.id==="world")) close();
  dragging=false;
}
/* le suivi est posé sur la fenêtre : le déplacement continue même si le pointeur
   passe sur le bandeau, la fiche ou hors du cadre, et le clic des cartes reste intact */
stage.addEventListener("pointerdown",onDown);
addEventListener("pointermove",onMove,{passive:true});
addEventListener("pointerup",onUp);
addEventListener("pointercancel",onUp);
addEventListener("blur",()=>{pts.clear();g0=null;dragging=false;stage.classList.remove("drag");});
stage.addEventListener("wheel",e=>{e.preventDefault();
  const r=stage.getBoundingClientRect();
  const d=e.deltaMode===1?e.deltaY*16:e.deltaY;      /* lignes ou pixels selon le périphérique */
  zoom(Math.pow(1.0016,-clamp(d,-260,260)),e.clientX-r.left,e.clientY-r.top);
},{passive:false});                                  /* molette et pincement : zoom · glissé : déplacement */
stage.addEventListener("dblclick",()=>$("t-fit").click());
addEventListener("resize",()=>box());
addEventListener("keydown",e=>{if(e.key==="Escape")close();});

/* mémoire locale — toujours faillible : on retombe silencieusement sur « première visite » */
const mem={
  get(k){try{return localStorage.getItem("climat:"+k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem("climat:"+k,v);}catch(e){}}
};

$("h-main").onclick=()=>select(21);
$("out-h").onclick=()=>{const h=$("hero"),c=h.classList.toggle("closed");
  $("out-h").setAttribute("aria-expanded",c?"false":"true"); mem.set("out",c?"closed":"open");};
if(mem.get("out")==="closed") $("hero").classList.add("closed");
$("out-h").setAttribute("aria-expanded",$("hero").classList.contains("closed")?"false":"true");
$("h-l").onclick=openLocks;
$("src-b").onclick=ev=>{ev.stopPropagation();openSources();};
markScen(0); apply(null); applyDim(); home();

/* ============================================================
   VISITE GUIDÉE — cinq gestes qui racontent l'outil
   ============================================================ */
const setL=o=>{Object.assign(S,o);markScen();};
const TOUR=[
 {h:"Voici la trajectoire actuelle",
  p:"Si le monde prolonge ses politiques en place jusqu'en 2100, le thermomètre monte de +2,8 °C. Tout ce que vous voyez à gauche en découle : les espèces, la mer, les récoltes, les conflits. Et quatre seuils de bascule sont déjà franchis sur cette trajectoire.",
  run:()=>{LEVERS.forEach(l=>S[l.k]=l.def);boot=true;markScen(0);apply(1);}},
 {h:"Les causes se règlent sur les cartes",
  p:"Les cartes de gauche sont ce que nous faisons. Huit d'entre elles portent un réglage, signalé par un trait bleu dans le coin. Sur celle-ci : − et + sur la carte, ou le curseur dans la fiche. Montons le transport mondial de moitié.",
  run:()=>{select(4);}},
 {h:"L'onde traverse tout le graphe",
  p:"Chaque carte touchée recalcule la suivante, jusqu'aux famines et aux conflits armés. Le transport seul pèse un quart des émissions : +50 % ne déplace le thermomètre que de 0,1 °C.",
  run:()=>{setL({tra:150});apply(4,true);}},
 {h:"Des seuils de bascule se franchissent",
  p:"Poussons tout le monde fossile. À +3,6 °C, cinq seuils sont franchis — récifs, calottes, permafrost, glaciers, Amazonie. Un cadenas apparaît sur chaque carte concernée : au-delà de ce point, une boucle s'entretient toute seule.",
  run:()=>{close();setL({ind:150,bat:140,tra:160,agr:125,def:135,low:8,sink:85,ccs:0});apply(1);}},
 {h:"Chaque réglage rejoue le monde",
  p:"Revenons à un monde sobre. La température retombe à +1,5 °C, les canicules s'effondrent, et les cadenas se rouvrent : la simulation ne garde aucune mémoire de ce qui a été essayé avant. Le climat réel, lui, ne se rejoue pas — c'est ce que ces seuils servent à montrer.",
  run:()=>{setL({ind:40,bat:30,tra:30,agr:65,def:10,low:85,sink:130,ccs:5});apply(1);}}
];

/* la barre d'aide et la visite occupent le même bas d'écran : jamais les deux à la fois */
function hintShow(){const h=$("hint");if(!h)return;
  h.style.opacity="";clearTimeout(hintShow.tm);
  hintShow.tm=setTimeout(()=>{h.style.opacity=0;},7000);}
function hintHide(){const h=$("hint");if(!h)return;clearTimeout(hintShow.tm);h.style.opacity=0;}

let step=-1;
const tourEl=$("tour");
function tourShow(){
  const t=TOUR[step];
  $("t-i").textContent=step+1; $("t-h").textContent=t.h; $("t-p").textContent=t.p;
  $("t-next").textContent=step===TOUR.length-1?"Terminer":"Suivant";
  tourEl.hidden=false; tourEl.style.animation="none"; void tourEl.offsetWidth; tourEl.style.animation="";
  hintHide();
  t.run&&t.run();
}
function tourNext(){ step++; if(step>=TOUR.length){tourEnd();return;} tourShow(); }
function tourEnd(){ tourEl.hidden=true; step=-1; mem.set("seen","1"); hintShow(); }
$("t-next").onclick=tourNext;
$("t-skip").onclick=tourEnd;
$("t-tour").onclick=()=>{step=-1;tourNext();};
addEventListener("keydown",e=>{if(!tourEl.hidden&&e.key==="Enter")tourNext();});

/* première visite : la visite se lance seule. Ensuite : seulement la barre d'aide,
   la visite restant à un clic sur « ? ». */
if(mem.get("seen")==="1") hintShow();
else setTimeout(()=>{if(step<0)tourNext();},900);
</script>
